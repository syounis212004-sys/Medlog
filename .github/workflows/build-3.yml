name: Build MedLog APK

# Put this file in your repo at:  .github/workflows/build.yml
# Put the source ZIP in the repo root with exactly this name:  medlog.zip
# Every push (or "Run workflow") builds a signed APK and publishes it under "Releases".

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medlog-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source ZIP
        run: |
          if [ ! -f medlog.zip ]; then
            echo "::error::medlog.zip was not found in the repo root. Upload it next to the .github folder."
            exit 1
          fi
          rm -rf app
          mkdir app
          unzip -q medlog.zip -d app
          P=$(find app -maxdepth 3 -name pubspec.yaml | head -n 1)
          if [ -z "$P" ]; then
            echo "::error::pubspec.yaml not found inside medlog.zip"
            exit 1
          fi
          APP_DIR=$(dirname "$P")
          echo "APP_DIR=$GITHUB_WORKSPACE/$APP_DIR" >> "$GITHUB_ENV"
          echo "Source folder: $APP_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing key (stored encrypted, safe for a public repo)
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ] || [ ${#PASS} -lt 12 ]; then
            echo "::error::Add a repository secret named SIGNING_PASSPHRASE (at least 12 characters): Settings > Secrets and variables > Actions > New repository secret. Keep a copy of it somewhere safe."
            exit 1
          fi
          mkdir -p signing "$RUNNER_TEMP/sk"
          if [ -f signing/medlog.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in signing/medlog.enc | tar -xz -C "$RUNNER_TEMP/sk" || { echo "::error::Could not decrypt the signing key. SIGNING_PASSPHRASE is different from the one used the first time."; exit 1; }
            echo "Using existing signing key."
          else
            KP=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/sk/medlog.jks" -storetype PKCS12 \
              -alias medlog -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KP" -keypass "$KP" \
              -dname "CN=MedLog, O=Personal, C=PS"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=medlog\n' "$KP" "$KP" > "$RUNNER_TEMP/sk/key.properties"
            tar -czf - -C "$RUNNER_TEMP/sk" medlog.jks key.properties | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -out signing/medlog.enc
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/medlog.enc
            git commit -m "Add encrypted MedLog signing key (do not delete signing/)"
            git push
            echo "Created a new signing key."
          fi

      - name: Generate Android project and patch it
        run: |
          flutter create --platforms=android --org com.medlog --project-name medlog --no-pub "$RUNNER_TEMP/gen"
          rm -rf "$APP_DIR/android"
          cp -r "$RUNNER_TEMP/gen/android" "$APP_DIR/android"
          cp "$RUNNER_TEMP/gen/.metadata" "$APP_DIR/.metadata" || true
          python3 "$APP_DIR/tool/patch_android.py" "$APP_DIR/android" "$APP_DIR/tool"
          {
            echo "storeFile=$RUNNER_TEMP/sk/medlog.jks"
            grep -E '^(storePassword|keyPassword|keyAlias)=' "$RUNNER_TEMP/sk/key.properties"
          } > "$APP_DIR/android/key.properties"

      - name: Get packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Check icon names (replaces unknown ones so the build cannot fail on them)
        run: python3 "$APP_DIR/tool/check_icons.py" "$APP_DIR"

      - name: Analyze code (lists ALL errors at once, fails fast)
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Prepare APK
        run: |
          VERSION=$(grep -E '^version:' "$APP_DIR/pubspec.yaml" | head -n 1 | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "$APP_DIR/build/app/outputs/flutter-apk/app-release.apk" MedLog.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedLog ${{ env.VERSION }} (build ${{ github.run_number }})
          files: MedLog.apk
          body: |
            Install MedLog.apk over the old version. Your data stays as long as the encrypted key in `signing/`
            and the SIGNING_PASSPHRASE secret stay the same.
