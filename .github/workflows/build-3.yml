name: Build MedLog APK

# The Flutter project is in app/ (source, assets, tests, tools).
# On every push to main: tests + analysis, a signed APK, and a release under "Releases".
# On a pull request: tests + analysis only.
# Run workflow (any branch): builds the APK; "publish" = false keeps it as a downloadable artifact only.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (false = only keep the APK as an artifact)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: medlog-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze code
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: app
        run: bash tool/run_tests.sh

      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/test_output/summary.txt
          retention-days: 7

  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare signing key (stored encrypted, safe for a public repo)
        env:
          PASS: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ] || [ ${#PASS} -lt 12 ]; then
            echo "::error::Add a repository secret named SIGNING_PASSPHRASE (at least 12 characters): Settings > Secrets and variables > Actions > New repository secret. Keep a copy of it somewhere safe."
            exit 1
          fi
          mkdir -p signing "$RUNNER_TEMP/sk"
          if [ -f signing/medlog.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PASS -in signing/medlog.enc | tar -xz -C "$RUNNER_TEMP/sk" || { echo "::error::Could not decrypt the signing key. SIGNING_PASSPHRASE is different from the one used the first time."; exit 1; }
            echo "Using existing signing key."
          else
            echo "::error::signing/medlog.enc is missing. Without it the APK would be signed with a NEW key and could not update the installed app. Restore the folder signing/ from the history."
            exit 1
          fi

      - name: Generate Android project and patch it
        run: |
          APP_DIR="$GITHUB_WORKSPACE/app"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          flutter create --platforms=android --org com.medlog --project-name medlog --no-pub "$RUNNER_TEMP/gen"
          rm -rf "$APP_DIR/android"
          cp -r "$RUNNER_TEMP/gen/android" "$APP_DIR/android"
          cp "$RUNNER_TEMP/gen/.metadata" "$APP_DIR/.metadata" || true
          python3 "$APP_DIR/tool/patch_android.py" "$APP_DIR/android" "$APP_DIR/tool"
          {
            echo "storeFile=$RUNNER_TEMP/sk/medlog.jks"
            grep -E '^(storePassword|keyPassword|keyAlias)=' "$RUNNER_TEMP/sk/key.properties"
          } > "$APP_DIR/android/key.properties"

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Prepare APK
        run: |
          VERSION=$(grep -E '^version:' app/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/app/outputs/flutter-apk/app-release.apk MedLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedLog-apk
          path: MedLog.apk
          retention-days: 3

    outputs:
      version: ${{ env.VERSION }}

  release:
    name: Publish release
    needs: [test, build]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MedLog-apk

      - name: Read the version
        uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: app/pubspec.yaml
          sparse-checkout-cone-mode: false

      - name: Version
        run: |
          VERSION=$(grep -E '^version:' src/app/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedLog ${{ env.VERSION }} (build ${{ github.run_number }})
          files: MedLog.apk
          body: |
            Install MedLog.apk over the old version. Your data stays as long as the encrypted key in `signing/`
            and the SIGNING_PASSPHRASE secret stay the same.
